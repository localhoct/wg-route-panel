[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:wgpanel

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:panel]
command=/usr/local/bin/wg-route-panel serve
directory=/app
user=wgpanel
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PANEL_CONFIG_PATH="/etc/wg-route-panel/panel.yaml"

[program:sing-box]
command=/usr/local/bin/sing-box run -c /var/lib/wg-route-panel/sing-box/config.json
directory=/var/lib/wg-route-panel
user=root
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
