listen_addr: "127.0.0.1:9090"
base_url: "https://panel.example.com"
session_secret: "" # set PANEL_SESSION_SECRET (32+ random chars)
db_path: "/var/lib/wg-route-panel/panel.db"
secure_cookies: true
trusted_proxies: []
wireguard:
  interface_name: "wg0"
  config_path: "/etc/wg-route-panel/wireguard/wg0.conf"
  probe_address: "" # optional address tested through wg0
sing_box:
  binary_path: "/usr/local/bin/sing-box"
  config_path: "/var/lib/wg-route-panel/sing-box/config.json"
  manager: "supervisor"
  supervisorctl_path: "/usr/bin/supervisorctl"
xray:
  binary_path: "/usr/local/bin/xray"
  config_path: "/var/lib/wg-route-panel/xray/config.json"
  manager: "supervisor"
  service_name: "xray"
  supervisorctl_path: "/usr/bin/supervisorctl"
geosite:
  path: "/etc/wg-route-panel/geosite/geosite.dat"
  update_url: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
  sha256: ""
dns:
  listen_addr: "127.0.0.1"
  port: 5353
  direct_upstream: "1.1.1.1"
  tunnel_upstream: "8.8.8.8"
socks:
  listen_addr: "127.0.0.1"
  port: 1080
firewall:
  enabled: true
log:
  level: "info"
  file: "/var/log/wg-route-panel/panel.log"
