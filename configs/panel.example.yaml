listen_addr: "127.0.0.1:9090"
base_url: "https://panel.example.com"
session_secret: "" # set PANEL_SESSION_SECRET (32+ random chars)
db_path: "/var/lib/wg-route-panel/panel.db"
secure_cookies: true
trusted_proxies: []
wireguard:
  interface_name: "wg0"
  config_path: "/etc/wg-route-panel/wireguard/wg0.conf"
  probe_address: "" # optional address tested through wg0
sing_box:
  binary_path: "/usr/local/bin/sing-box"
  config_path: "/var/lib/wg-route-panel/sing-box/config.json"
  cache_file_path: "/var/lib/wg-route-panel/sing-box/cache.db"
  manager: "supervisor"
  supervisorctl_path: "/usr/bin/supervisorctl"
firewall:
  enabled: true
log:
  level: "info"
  file: "/var/log/wg-route-panel/panel.log"
