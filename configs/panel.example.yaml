# WG Route Panel Configuration Example
# Copy this to /etc/wg-route-panel/panel.yaml and adjust as needed.

listen_addr: "127.0.0.1:8080"
base_url: "http://localhost:8080"
session_secret: "CHANGE_THIS_TO_A_LONG_RANDOM_STRING"
db_path: "/var/lib/wg-route-panel/panel.db"

wireguard:
  interface_name: "wg0"
  config_path: "/etc/wg-route-panel/wireguard/wg0.conf"

xray:
  binary_path: "/usr/local/bin/xray"
  config_path: "/etc/wg-route-panel/xray/config.json"

geosite:
  path: "/etc/wg-route-panel/geosite/geosite.dat"
  update_url: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

dns:
  listen_addr: "127.0.0.1"
  port: 5353

socks:
  listen_addr: "127.0.0.1"
  port: 1080

firewall:
  enabled: true

log:
  level: "info"
  file: "/var/log/wg-route-panel/panel.log"
