name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Download dependencies
      run: go mod download

    - name: Format check
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v -o bin/panel ./cmd/panel
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wg-route-panel-linux-amd64
        path: bin/panel
