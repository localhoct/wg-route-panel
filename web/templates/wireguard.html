{{define "content"}}<div class="d-flex justify-content-between"><div><h1 class="h2">WireGuard via sing-box</h1><p class="text-secondary">sing-box userspace endpoint and <code>{{.WG.State}}</code> system-interface health.</p></div></div><div class="alert alert-info">Upload a wg-quick-style file. The panel converts it to a validated sing-box WireGuard endpoint; it never starts <code>wg-quick</code>.</div><div class="btn-group mb-4"><form method="post" action="/api/wireguard/start"><input type="hidden" name="gorilla.csrf.Token" value="{{$.CSRF}}"><button class="btn btn-success">Start sing-box</button></form><form method="post" action="/api/wireguard/stop"><input type="hidden" name="gorilla.csrf.Token" value="{{$.CSRF}}"><button class="btn btn-danger">Stop</button></form><form method="post" action="/api/wireguard/restart"><input type="hidden" name="gorilla.csrf.Token" value="{{$.CSRF}}"><button class="btn btn-warning">Restart</button></form></div><form method="post" enctype="multipart/form-data" action="/api/wireguard/config"><input type="hidden" name="gorilla.csrf.Token" value="{{.CSRF}}"><label class="form-label">WireGuard source configuration (private keys are never written to logs)</label><textarea class="form-control font-monospace" rows="18" name="config" spellcheck="false">{{.Config}}</textarea><input class="form-control mt-2" type="file" name="file" accept=".conf,text/plain"><button class="btn btn-primary mt-3">Convert, validate & save</button></form>{{end}}
