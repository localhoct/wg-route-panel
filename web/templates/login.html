{{define "content"}}<div class="row justify-content-center py-5"><div class="col-md-5 col-lg-4"><div class="card shadow"><div class="card-body p-4"><h1 class="h3 mb-1">WG Route Panel</h1><p class="text-secondary mb-4">Administrator sign in</p><form method="post" action="/login"><input type="hidden" name="gorilla.csrf.Token" value="{{.CSRF}}"><label class="form-label">Username</label><input class="form-control mb-3" name="username" autocomplete="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" autocomplete="current-password" required><label class="form-label">TOTP (if enabled)</label><input class="form-control mb-4" name="totp" inputmode="numeric" pattern="[0-9]{6}"><button class="btn btn-primary w-100">Sign in</button></form></div></div></div></div>{{end}}
