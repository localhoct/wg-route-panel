{{define "content"}}<h1 class="h2">Settings</h1><div class="row"><div class="col-md-6"><div class="card"><div class="card-body"><h2 class="h5">Change password</h2><form method="post" action="/api/settings/password"><input type="hidden" name="gorilla.csrf.Token" value="{{.CSRF}}"><input class="form-control" type="password" name="password" minlength="12" autocomplete="new-password" required><button class="btn btn-primary mt-3">Update password</button></form></div></div></div><div class="col-md-6"><div class="card"><div class="card-body"><h2 class="h5">Backup</h2><p>Use <code>sudo scripts/backup.sh</code>. Backups contain sensitive material and must be encrypted at rest.</p></div></div></div></div>{{end}}
