{{define "content"}}<h1 class="h2">Audit logs</h1><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Time</th><th>Action</th><th>Details</th><th>Source</th></tr></thead><tbody>{{range .Logs}}<tr><td>{{.CreatedAt}}</td><td>{{.Action}}</td><td>{{.Details}}</td><td>{{.IPAddress}}</td></tr>{{else}}<tr><td colspan="4">No audit events.</td></tr>{{end}}</tbody></table></div>{{end}}
