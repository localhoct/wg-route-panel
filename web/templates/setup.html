{{define "content"}}<div class="row justify-content-center py-5"><div class="col-md-6 col-lg-5"><div class="card shadow"><div class="card-body p-4"><h1 class="h3 mb-1">Welcome to WG Route Panel</h1><p class="text-secondary mb-4">Create the first administrator account to finish setup. This page is only available until an administrator exists &mdash; after that, use <a href="/login">Sign in</a>.</p><form method="post" action="/setup"><input type="hidden" name="gorilla.csrf.Token" value="{{.CSRF}}"><label class="form-label">Username</label><input class="form-control mb-3" name="username" autocomplete="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="12" autocomplete="new-password" required><label class="form-label">Confirm password</label><input class="form-control mb-4" type="password" name="password_confirm" minlength="12" autocomplete="new-password" required><button class="btn btn-primary w-100">Create administrator</button></form></div></div></div></div>{{end}}
