{{define "content"}}<h1 class="h2">DNS rules</h1><div class="alert alert-info">DNS changes name resolution only; it does not proxy arbitrary client traffic. Use SOCKS5 or an authorized proxy client for traffic routing.</div><form class="row g-2 mb-4" method="post" action="/api/dns/rules"><input type="hidden" name="gorilla.csrf.Token" value="{{.CSRF}}"><div class="col-md-4"><input class="form-control" name="domain" placeholder="example.com" required></div><div class="col-md-3"><select class="form-select" name="action"><option>direct</option><option>proxy-route</option><option>block</option><option>static</option></select></div><div class="col-md-3"><input class="form-control" name="static_ip" placeholder="Static IP (optional)"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add rule</button></div></form><div class="table-responsive"><table class="table"><thead><tr><th>Domain</th><th>Action</th><th>Static IP</th><th>Applied</th></tr></thead><tbody>{{range .Rules}}<tr><td>{{.Domain}}</td><td>{{.Action}}</td><td>{{.StaticIP}}</td><td>{{.Applied}}</td></tr>{{else}}<tr><td colspan="4">No rules.</td></tr>{{end}}</tbody></table></div>{{end}}
