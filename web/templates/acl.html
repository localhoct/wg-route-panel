{{define "content"}}<h1 class="h2">Access control</h1><div class="alert alert-danger"><strong>Default deny:</strong> DNS and SOCKS are inaccessible remotely until an explicit source CIDR is added. These rules never alter SSH ports.</div><form class="row g-2 mb-4" method="post" action="/api/acl/rules"><input type="hidden" name="gorilla.csrf.Token" value="{{.CSRF}}"><div class="col-md-3"><select class="form-select" name="scope"><option>panel</option><option>dns</option><option>socks</option><option>api</option></select></div><div class="col-md-6"><input class="form-control" name="cidr" placeholder="192.0.2.10 or 2001:db8::/64" required></div><div class="col-md-3"><button class="btn btn-primary w-100">Allow source</button></div></form><table class="table"><thead><tr><th>Scope</th><th>CIDR</th><th>Applied</th></tr></thead><tbody>{{range .Rules}}<tr><td>{{.Scope}}</td><td><code>{{.CIDR}}</code></td><td>{{.Applied}}</td></tr>{{else}}<tr><td colspan="3">No remote sources allowed.</td></tr>{{end}}</tbody></table>{{end}}
