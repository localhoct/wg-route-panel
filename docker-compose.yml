services:
  panel:
    build:
      context: .
      args:
        SING_BOX_VERSION: "1.13.19"
    image: wg-route-panel:local
    container_name: wg-route-panel
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PANEL_CONFIG_PATH: /etc/wg-route-panel/panel.yaml
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:?set PANEL_SESSION_SECRET in .env}
    volumes:
      - ./data:/var/lib/wg-route-panel
      - ./configs/panel.docker.yaml:/etc/wg-route-panel/panel.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
